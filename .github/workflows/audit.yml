name: scan

on:
  workflow_dispatch:

jobs:
  security-scan:                 # ← ジョブ ID を追加
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude security scan
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}  # 必要
          github_token:      ${{ secrets.GITHUB_TOKEN }}       # 必要
          allowed_tools: |
            Bash(npm audit)
            Bash(yarn audit)
            View
            Write
          direct_prompt: |
            セキュリティ監査を実行：
            1. 依存関係の脆弱性をスキャン
            2. ハードコードされた認証情報を検索
            3. OWASP Top 10 に基づくコードレビュー
            4. 修正 PR を自動生成
