name: Move Workflow Definitions

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to checkout'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  move-workflows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Check if source directory exists
        id: check-source
        run: |
          if [ -d "_github/workflows" ]; then
            echo "source_exists=true" >> $GITHUB_OUTPUT
          else
            echo "source_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create target directory if not exists
        if: steps.check-source.outputs.source_exists == 'true'
        run: |
          mkdir -p .github/workflows
      
      - name: Move workflow files
        if: steps.check-source.outputs.source_exists == 'true'
        run: |
          # Move all .yml files from _github/workflows/ to .github/workflows/
          if ls _github/workflows/*.yml 1> /dev/null 2>&1; then
            mv _github/workflows/*.yml .github/workflows/
            echo "Moved workflow files successfully"
          else
            echo "No .yml files found in _github/workflows/"
          fi
      
      - name: Clean up source directory
        if: steps.check-source.outputs.source_exists == 'true'
        run: |
          # Remove all files except .gitkeep from _github/workflows/
          find _github/workflows/ -type f ! -name '.gitkeep' -delete
          
          # Create .gitkeep if it doesn't exist
          touch _github/workflows/.gitkeep
          
          echo "Cleaned up _github/workflows/ directory"
      
      - name: Create Pull Request
        if: steps.check-source.outputs.source_exists == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Move workflow definitions from _github/workflows to .github/workflows"
          title: "Move workflow definitions"
          body: |
            This PR moves workflow files from `_github/workflows/` to `.github/workflows/`
            
            Changes:
            - Moved all .yml files to the correct location
            - Cleaned up source directory (only .gitkeep remains)
          branch: move-workflows-${{ github.run_id }}
          delete-branch: true
      
      - name: Summary
        run: |
          if [ "${{ steps.check-source.outputs.source_exists }}" == "true" ]; then
            echo "✅ Workflow files moved successfully"
            echo "📁 Source: _github/workflows/"
            echo "📁 Target: .github/workflows/"
            echo "🧹 _github/workflows/ now contains only .gitkeep"
          else
            echo "ℹ️ No _github/workflows/ directory found - nothing to move"
          fi